spring.application.name=mensajeria

#servidor :  localhost. puerto : 3306. base de datos mensajeria
spring.datasource.url=jdbc:mysql://localhost:3306/mensajeria

#usuario para conectar a mysql
spring.datasource.username=root
spring.datasource.password=


# clase del controlador JDBC que permite coenctarse con mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#JPA / HIBERNATE
#valida que la estructura de las tablas coincida con las entidades.
#Hibernate no crea ni modifica tablas; esa tarea realiza flyway
spring.jpa.hibernate.ddl-auto=validate

#Muestra en la consola las sentencias SQL ejecutradas por hibernate
spring.jpa.show-sql=true

#presenta las sentencias SQL con un formato mas legibles
spring.jpa.properties.hibernate.format_sql=true

#el microservicio estara disponible en http//localhost:8082
server.port=8082

#habilidad la ejecucuion de las migraciones pendientes al iniciar
spring.flyway.enabled=true

#corresponde a src/main/resources/db/migraciones adentro del proyecto
spring.flyway.locations=classpath:db/migracion